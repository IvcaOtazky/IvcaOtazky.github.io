<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 shades of Ivča</title>
<meta name="description" content="9 Ivči otázek">
<meta property="og:title" content="9 shades of Ivča">
<meta property="og:description" content="9 Ivči otázek">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- palette */
:root {
  --blush:        #f7e4e1;
  --blush-deep:   #f0d3cf;
  --ink:          #171010;
  --ink-soft:     rgba(23, 16, 16, .72);
  --gray:         #83706c;
  --gray-faint:   rgba(23, 16, 16, .42);
  --rule:         rgba(23, 16, 16, .22);

  --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
  --sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

  --ease-out: cubic-bezier(.16, .84, .26, 1);
}

/* ------------------------------------------------------------------ reset */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100svh;
  background: var(--blush);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 400;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 1px solid var(--ink);
  outline-offset: 4px;
  border-radius: 2px;
}

/* ============================================================== intro page */
.intro {
  position: relative;          /* the corner the two actions are pinned to */
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(2rem, 5vh, 3.2rem);
  padding: clamp(2rem, 5vh, 3.5rem) 1.5rem;
}

/* --- the N | shades / of | Ivča quadrant ---------------------------------- */
/* A true cross: the two rules are 1px grid tracks of their own, so they stay
   exactly between the words however wide the words happen to be.

   The columns start out sized to their content; once the script has measured
   them it keeps setting them in pixels, which is what lets the cross glide to
   its new place instead of jumping there when a word changes length. */
.title {
  display: grid;
  grid-template-columns: max-content 1px max-content;
  grid-template-rows: max-content 1px max-content;
  transition: grid-template-columns .55s var(--ease-out);
  column-gap: clamp(.55rem, 1.7vw, 1.3rem);
  row-gap: clamp(.05rem, .4vw, .25rem);
  font-family: var(--serif);
  font-size: clamp(3.2rem, 16vw, 7.4rem);
  line-height: .94;
  margin: 0 0 -.12em;   /* pull the list up into the title's descender space */
  letter-spacing: -.015em;
}

.title-cell {
  display: block;
  white-space: nowrap;
}

.title-count  { grid-area: 1 / 1; justify-self: end;   font-variant-numeric: tabular-nums; }
.title-shades { grid-area: 1 / 3; justify-self: start; font-style: italic; color: var(--gray); }
.title-of     { grid-area: 3 / 1; justify-self: end;   color: var(--gray); }
.title-ivca   { grid-area: 3 / 3; justify-self: start; font-style: italic; }

/* While the columns are being re-measured (first paint, a resize) they snap
   straight to their new size — only a word actually changing deserves a glide. */
.title-measuring { transition: none; }

.title-rule { background: var(--rule); }

/* The resting state of both rules is "drawn"; the entrance animation below is
   what starts them at zero, so they are visible even when it never runs. */
.title-rule-horizontal { grid-area: 2 / 1 / 3 / 4; height: 1px; }
.title-rule-vertical   { grid-area: 1 / 2 / 4 / 3; width: 1px; }

/* Each fragment arrives from its own side, on its own beat. */
.title-animated .title-count  { animation: arrive-from-left   .95s var(--ease-out)  .05s both; }
.title-animated .title-shades { animation: arrive-from-top    .95s var(--ease-out)  .22s both; }
.title-animated .title-of     { animation: arrive-from-bottom .95s var(--ease-out)  .38s both; }
.title-animated .title-ivca   { animation: arrive-from-right  .95s var(--ease-out)  .54s both; }
.title-animated .title-rule-horizontal { animation: draw-horizontal .8s var(--ease-out) .30s both; }
.title-animated .title-rule-vertical   { animation: draw-vertical   .8s var(--ease-out) .46s both; }

@keyframes arrive-from-left   { from { opacity: 0; transform: translateX(-.75em); } to { opacity: 1; transform: none; } }
@keyframes arrive-from-right  { from { opacity: 0; transform: translateX( .75em); } to { opacity: 1; transform: none; } }
@keyframes arrive-from-top    { from { opacity: 0; transform: translateY(-.55em); } to { opacity: 1; transform: none; } }
@keyframes arrive-from-bottom { from { opacity: 0; transform: translateY( .55em); } to { opacity: 1; transform: none; } }
@keyframes draw-horizontal    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw-vertical      { from { transform: scaleY(0); } to { transform: scaleY(1); } }

/* Whenever the number of selected questions changes, the count pulses up from
   below and the word beside it drops in from above — the same two directions
   they arrived from in the first place. */
.title-count.count-changed { animation: count-pulse .45s var(--ease-out); }
@keyframes count-pulse {
  0%   { opacity: .25; transform: translateY(.12em); }
  100% { opacity: 1;   transform: none; }
}

.title-shades.word-changed { animation: word-swap .55s var(--ease-out); }
@keyframes word-swap {
  0%   { opacity: 0; transform: translateY(-.32em); }
  100% { opacity: 1; transform: none; }
}

/* --- category checkboxes -------------------------------------------------- */
.categories {
  width: min(30rem, 100%);
  display: flex;
  flex-direction: column;
  gap: .1rem;
}

.category {
  display: flex;
  align-items: baseline;
  gap: .8rem;
  width: 100%;
  padding: .62rem .5rem;
  text-align: left;
  color: var(--gray);
  font-size: 1.02rem;
  border-radius: 3px;
  transition: color .25s var(--ease-out), transform .25s var(--ease-out), background-color .25s var(--ease-out);
}

.category:hover { color: var(--ink); transform: translateX(4px); background: rgba(255, 255, 255, .35); }
.category[aria-checked="true"] { color: var(--ink); }

/* A fixed width, so ticking a box never nudges the label sideways. */
.category-box {
  display: inline-flex;
  justify-content: center;
  width: 1.5em;
  font-family: var(--sans);
  font-size: .95rem;
  letter-spacing: -.04em;
  opacity: .55;
  transition: opacity .25s var(--ease-out);
}
.category[aria-checked="true"] .category-box { opacity: 1; }

/* The mark is its own element that is never added or removed, only drawn and
   undrawn: it keeps its width either way, so the brackets around it hold still
   while it animates. The two strokes are deliberately unequal and off-centre —
   a cross scribbled by hand rather than a typeset glyph. */
.category-mark {
  align-self: center;
  width: .78em;
  height: .78em;
  overflow: visible;                     /* the round cap of each stroke reaches past the viewBox */
  fill: none;
  stroke: currentColor;
  stroke-width: 1.35;
  stroke-linecap: round;
}

/* Each stroke is measured as one unit long (pathLength), so a dash offset of 1
   parks it entirely outside itself — invisible — and 0 draws it fully. Sliding
   between the two pulls the line out of its own starting point, which is what
   reads as a pencil stroke. */
.category-mark line {
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  transition: stroke-dashoffset .26s var(--ease-out);
}

/* Ticking draws the short stroke first, then the long one; unticking lifts the
   pencil in the opposite order, so the mark never disappears both-ends-at-once. */
.category[aria-checked="true"] .category-mark line { stroke-dashoffset: 0; }
.category-mark .mark-stroke-short { transition-delay: .09s; }
.category-mark .mark-stroke-long  { transition-delay: 0s; }
.category[aria-checked="true"] .mark-stroke-short { transition-delay: 0s; }
.category[aria-checked="true"] .mark-stroke-long  { transition-delay: .09s; }

.category-name { flex: 1; }

.category-count {
  font-size: .8rem;
  color: var(--gray-faint);
  font-variant-numeric: tabular-nums;
}

/* --- start button --------------------------------------------------------- */
.start {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.6rem, 4.5vw, 2.3rem);
  color: var(--ink);
  letter-spacing: .005em;
  transition: color .3s var(--ease-out), transform .3s var(--ease-out), opacity .3s var(--ease-out);
}

.start-arrow {
  display: inline-block;
  transition: transform .3s var(--ease-out);
}

.start:hover:not([disabled]) { color: var(--gray); transform: translateX(10px); }
.start:hover:not([disabled]) .start-arrow { transform: translateX(6px); }

.start[disabled] { opacity: .3; cursor: not-allowed; }

.intro-fade-in { animation: fade-up .8s var(--ease-out) both; }
.intro-fade-in.delay-categories { animation-delay: .75s; }
.intro-fade-in.delay-start      { animation-delay: .95s; }
.intro-fade-in.delay-actions    { animation-delay: 1.15s; }
@keyframes fade-up { from { opacity: 0; transform: translateY(1rem); } to { opacity: 1; transform: none; } }

/* Coming back from a question, the staggered entrance would mean waiting for
   the menu all over again — so the intro fades back in as a single piece. */
.intro-returning { animation: fade-up .45s var(--ease-out) both; }

/* ================================ the two actions every page carries with it */
/* Both screens offer the same pair — a link to whatever you are looking at, and
   a question of your own — so neither belongs to the reader alone. */
.icon-button {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .6rem;
  color: var(--gray);
  transition: color .25s var(--ease-out), transform .25s var(--ease-out);
}

.page-actions {
  display: flex;
  align-items: center;
  gap: .1rem;
}

/* The reader keeps them in its bar; the intro has no bar, and putting one in
   its centred stack would push the title off the middle of the page. So they
   are pinned to exactly the corner the reader's bar would have placed them in:
   the same inset, so they hold still when one screen becomes the other. */
.intro-actions {
  position: absolute;
  top: clamp(1.1rem, 3vw, 2rem);
  right: clamp(1.1rem, 3vw, 2rem);
}

.icon-button:hover { color: var(--ink); }
.back-button:hover { transform: translateX(-4px); }
.share-button:hover { transform: translateY(-2px); }
.propose-button:hover { transform: rotate(90deg); }
.icon-button svg { display: block; width: 20px; height: 20px; }

/* ========================================================== questions page */
.reader {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: clamp(1.1rem, 3vw, 2rem);
  gap: 1rem;
}

.reader-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.reader-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.6rem;
  padding: clamp(1rem, 5vh, 3rem) .25rem;
  text-align: center;
}

.question-category {
  font-size: .72rem;
  font-weight: 500;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gray-faint);
}

.question-text {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(2.1rem, 5.4vw, 3.7rem);
  line-height: 1.12;
  letter-spacing: -.012em;
  color: var(--gray);
  max-width: 20ch;
  margin: 0;
  text-wrap: balance;
}

.question-notes {
  display: flex;
  flex-direction: column;
  gap: .9rem;
  max-width: 44ch;
}

.question-notes p {
  margin: 0;
  font-size: 1rem;
  line-height: 1.65;
  color: var(--ink-soft);
  text-wrap: pretty;
}

/* Question changes slide in from the direction you travelled. */
.enter-forward  { animation: enter-forward  .5s var(--ease-out) both; }
.enter-backward { animation: enter-backward .5s var(--ease-out) both; }
@keyframes enter-forward  { from { opacity: 0; transform: translateX( 2.2rem); } to { opacity: 1; transform: none; } }
@keyframes enter-backward { from { opacity: 0; transform: translateX(-2.2rem); } to { opacity: 1; transform: none; } }

/* --- dot navigation ------------------------------------------------------- */
.reader-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(.5rem, 2vw, 1.2rem);
  padding-bottom: .5rem;
}

.nav-arrow {
  display: inline-flex;
  padding: .5rem;
  color: var(--gray-faint);
  transition: color .25s var(--ease-out), transform .25s var(--ease-out);
}
.nav-arrow:hover:not([disabled]) { color: var(--ink); }
.nav-previous:hover:not([disabled]) { transform: translateX(-3px); }
.nav-next:hover:not([disabled])     { transform: translateX(3px); }
.nav-arrow[disabled] { opacity: .25; cursor: not-allowed; }
.nav-arrow svg { width: 18px; height: 18px; display: block; }

.nav-dots {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 2px;
  max-width: min(46rem, 100%);
}

.nav-dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.1rem;
  height: 1.6rem;
  color: var(--gray-faint);
  font-size: .68rem;
  font-variant-numeric: tabular-nums;
  transition: color .2s var(--ease-out), transform .2s var(--ease-out);
}

.nav-dot::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}

.nav-dot.is-milestone { width: 1.7rem; }
.nav-dot.is-milestone::before { display: none; }
.nav-dot.is-milestone::after { content: attr(data-label); }

.nav-dot:hover { color: var(--ink); transform: translateY(-2px); }

.nav-dot[aria-current="true"] { color: var(--ink); }
.nav-dot[aria-current="true"]::before { width: 7px; height: 7px; }
.nav-dot[aria-current="true"].is-milestone::after { font-weight: 500; }

/* ========================================================== proposal page */
/* The third screen. Every row reads "Label ›" and then either its comment or
   the line you are writing on — the two share one slot, so the comment can fade
   out from under the words rather than shoving them sideways. Nothing here has
   a box, a border or a background: the caret is the only sign of an input. */
.proposal {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  padding: clamp(1.1rem, 3vw, 2rem);
  gap: 1rem;
}

.proposal-form {
  flex: 1;
  width: min(34rem, 100%);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: clamp(1rem, 3vh, 1.7rem);
  padding: clamp(1rem, 4vh, 2.5rem) 0;
}

.proposal-header {
  font-family: var(--serif);
  font-style: italic;
  font-size: clamp(1.5rem, 4.4vw, 2.2rem);
  font-weight: 400;
  letter-spacing: -.01em;
  color: var(--ink);
  margin: 0 0 .3rem;
}

.proposal-field {
  display: flex;
  align-items: baseline;
  gap: .7rem;
  font-size: 1rem;
  line-height: 1.6;
  color: var(--gray);
}

.proposal-label {
  display: inline-flex;
  align-items: baseline;
  gap: .3rem;
  flex: none;
  text-align: left;
  color: var(--gray);
  transition: color .25s var(--ease-out), transform .25s var(--ease-out);
}
button.proposal-label:hover { color: var(--ink); transform: translateX(4px); }
.proposal-field.is-open > .proposal-label { color: var(--ink); }

.proposal-arrow {
  display: inline-block;
  transition: transform .25s var(--ease-out);
}
button.proposal-label:hover .proposal-arrow,
.proposal-choice:hover .proposal-arrow { transform: translateX(3px); }

/* "(optional)" rides above the word it qualifies, quieter than everything. The
   label is a flex row, and a flex item ignores vertical-align — so <sup> has to
   be lifted by hand. */
.proposal-optional {
  position: relative;
  top: -.5em;
  font-size: .58em;
  color: var(--gray-faint);
  letter-spacing: .02em;
}

.proposal-slot {
  position: relative;
  flex: 1;
  min-width: 0;
}

/* Out of flow, so the writing line below keeps its place while this fades. The
   line-height is an absolute length: it makes the smaller text sit in the same
   line box as the input it is layered over. */
.proposal-comment {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  font-size: .82rem;
  line-height: 1.6rem;
  font-style: italic;
  color: var(--gray-faint);
  pointer-events: none;
  transition: opacity .35s var(--ease-out);
}
.proposal-field.is-open .proposal-comment { opacity: 0; }

/* Invisible until its row is opened, but never removed — the row keeps its
   height either way, so opening one does not shuffle the ones below it. */
.proposal-input {
  display: block;
  width: 100%;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  outline: none;
  resize: none;
  overflow: hidden;
  font: inherit;
  line-height: inherit;
  color: var(--ink);
  caret-color: var(--ink);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s var(--ease-out);
}
.proposal-field.is-open .proposal-input { opacity: 1; pointer-events: auto; }

/* --- the category line ---------------------------------------------------- */
.proposal-choices {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  flex: 1;
  gap: .1rem 1rem;
}

.proposal-choice {
  display: inline-flex;
  align-items: baseline;
  gap: .3rem;
  color: var(--gray);
  transition: color .25s var(--ease-out), transform .25s var(--ease-out);
}
.proposal-choice:hover { color: var(--ink); transform: translateX(3px); }
.proposal-choice[aria-pressed="true"] { color: var(--ink); }

/* The new category writes itself on the same line, once there is room for it. */
.proposal-new-category { flex: 1 0 9rem; }

/* --- what the form has to say back ---------------------------------------- */
.proposal-problem {
  font-size: .82rem;
  font-style: italic;
  line-height: 1.6;
  color: var(--ink-soft);
  padding-left: .2rem;
  margin: 0;
}

.proposal-problem a {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: .18em;
  text-decoration-thickness: 1px;
}

.proposal-send { align-self: flex-start; }

@media (max-width: 30rem) {
  /* Too little width to keep the label and the writing line on one row. */
  .proposal-field { flex-wrap: wrap; gap: .1rem .7rem; }
  .proposal-slot { flex-basis: 100%; }
}

/* --- copied-link toast ---------------------------------------------------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 2rem;
  transform: translate(-50%, 1rem);
  padding: .6rem 1.1rem;
  border-radius: 999px;
  background: var(--ink);
  color: var(--blush);
  font-size: .85rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s var(--ease-out), transform .3s var(--ease-out);
}
.toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

/* ------------------------------------------------------------- small print */
.footnote {
  text-align: center;
  font-size: .75rem;
  color: var(--gray-faint);
  letter-spacing: .02em;
}

@media (max-width: 30rem) {
  .question-text { max-width: 14ch; }
  .nav-dots { gap: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001s !important;
    animation-delay: 0s !important;
    transition-duration: .001s !important;
  }
}
</style>
</head>
<body>

<!-- ============================================================ intro page -->
<main class="intro" id="intro-page">

  <h1 class="title title-animated" id="title">
    <span class="title-cell title-count" id="selected-question-count">9</span>
    <span class="title-cell title-shades" id="shades-word">shades</span>
    <span class="title-rule title-rule-horizontal"></span>
    <span class="title-rule title-rule-vertical"></span>
    <span class="title-cell title-of" id="of-word">of</span>
    <span class="title-cell title-ivca" id="ivca-word">Ivča</span>
  </h1>

  <div class="categories intro-fade-in delay-categories" id="category-list" role="group" aria-label="Kategorie otázek">
    <button class="category" role="checkbox" aria-checked="true" data-slug="deep"><span class="category-box">[<svg class="category-mark" viewBox="0 0 10 10" aria-hidden="true"><line class="mark-stroke-short" pathLength="1" x1="2.1" y1="2.4" x2="7.9" y2="7.8" /><line class="mark-stroke-long" pathLength="1" x1="8.4" y1="1.5" x2="1.4" y2="8.7" /></svg>]</span><span class="category-name">Deep</span><span class="category-count">4</span></button>
    <button class="category" role="checkbox" aria-checked="true" data-slug="funky"><span class="category-box">[<svg class="category-mark" viewBox="0 0 10 10" aria-hidden="true"><line class="mark-stroke-short" pathLength="1" x1="2.1" y1="2.4" x2="7.9" y2="7.8" /><line class="mark-stroke-long" pathLength="1" x1="8.4" y1="1.5" x2="1.4" y2="8.7" /></svg>]</span><span class="category-name">Funky</span><span class="category-count">4</span></button>
    <button class="category" role="checkbox" aria-checked="true" data-slug="matej"><span class="category-box">[<svg class="category-mark" viewBox="0 0 10 10" aria-hidden="true"><line class="mark-stroke-short" pathLength="1" x1="2.1" y1="2.4" x2="7.9" y2="7.8" /><line class="mark-stroke-long" pathLength="1" x1="8.4" y1="1.5" x2="1.4" y2="8.7" /></svg>]</span><span class="category-name">Matěj</span><span class="category-count">1</span></button>
  </div>

  <button class="start intro-fade-in delay-start" id="start-button">Start <span class="start-arrow">&rsaquo;</span></button>

  <div class="page-actions intro-actions intro-fade-in delay-actions">
    <button class="icon-button share-button" aria-label="Sdílet odkaz na tuto stránku">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="2.6"/>
        <circle cx="6" cy="12" r="2.6"/>
        <circle cx="18" cy="19" r="2.6"/>
        <path d="M8.3 10.8l7.4-4.3M8.3 13.2l7.4 4.3"/>
      </svg>

<script>
"use strict";

/* The build script injects every question from questions.md right here. */
const ALL_QUESTIONS = [

"notes": [],

"categoryName": "Funky"
},
{

"notes": [
"(Možná by stálo za to přeformulovat, viz. debata o PhD nebo kariéře ve finance :D)"
],
"category": "funky",
"categoryName": "Funky"
},
{
"id": "9",
"text": "Jak se v čase měnilo tvoje vnímání sebe sama?",
"notes": [],
"category": "matej",
"categoryName": "Matěj"
}
];

const introPage        = document.getElementById("intro-page");
const questionPage     = document.getElementById("question-page");
const titleElement     = document.getElementById("title");
const countElement     = document.getElementById("selected-question-count");
const shadesElement    = document.getElementById("shades-word");
const ofElement        = document.getElementById("of-word");
const ivcaElement      = document.getElementById("ivca-word");
const categoryList     = document.getElementById("category-list");
const startButton      = document.getElementById("start-button");
const backButton       = document.getElementById("back-button");
const questionStage    = document.getElementById("question-stage");
const navigationDots   = document.getElementById("navigation-dots");
const previousButton   = document.getElementById("previous-button");
const nextButton       = document.getElementById("next-button");
const toast            = document.getElementById("toast");

const categoryButtons = Array.from(categoryList.querySelectorAll(".category"));

/* Every question carries the slug of the category it came from, so a pool is
   simply "the questions whose category is currently switched on". */
function questionsInCategories(categorySlugs) {
  if (categorySlugs.length === 0) return [];
  return ALL_QUESTIONS.filter(question => categorySlugs.includes(question.category));
}

function selectedCategorySlugs() {
  return categoryButtons
    .filter(button => button.getAttribute("aria-checked") === "true")
    .map(button => button.dataset.slug);
}

/* ------------------------------------------------------------- intro page */

/* "shades" is only the opening word — every change of the count moves the title
   on to the next way of describing what the selected questions are. */
const WORDS_FOR_QUESTIONS = [
  "shades", "questions", "gems",
  "thoughts", "riddles", "facets", "layers", 
  "musings", "glimpses", 
];

let currentWordIndex = 0;

function moveOnToTheNextWord() {
  currentWordIndex = (currentWordIndex + 1) % WORDS_FOR_QUESTIONS.length;
  shadesElement.textContent = WORDS_FOR_QUESTIONS[currentWordIndex];

  shadesElement.classList.remove("word-changed");
  void shadesElement.offsetWidth;         /* restart the swap animation */
  shadesElement.classList.add("word-changed");

  fitTitleColumnsToTheWords();
}

/* The cross sits on two 1px grid tracks, so its position is decided entirely by
   how wide the outer columns are. Left to itself the grid resizes those columns
   the instant a word changes and the cross snaps sideways; pinning them to
   measured pixel widths instead lets the transition carry it across. Each cell
   is sized to its own content (justify-self is never "stretch"), so a cell's own
   width still reads as the width of its text however wide its column is. */
function fitTitleColumnsToTheWords(withoutAnimating) {
  const widthOf = element => element.getBoundingClientRect().width;
  const left  = Math.max(widthOf(countElement), widthOf(ofElement));
  const right = Math.max(widthOf(ivcaElement), widthOf(shadesElement));

  if (withoutAnimating) titleElement.classList.add("title-measuring");
  titleElement.style.gridTemplateColumns = left + "px 1px " + right + "px";
  if (withoutAnimating) {
    void titleElement.offsetWidth;        /* land on the new size before the
                                             transition is switched back on */
    titleElement.classList.remove("title-measuring");
  }
}

/* The title is sized in viewport units and set in a webfont, so both a resize
   and the font finally arriving change what the words measure. */
fitTitleColumnsToTheWords(true);
addEventListener("resize", () => fitTitleColumnsToTheWords(true));
if (document.fonts) document.fonts.ready.then(() => fitTitleColumnsToTheWords(true));

function refreshSelectedQuestionCount() {
  const selectedCount = questionsInCategories(selectedCategorySlugs()).length;
  startButton.disabled = selectedCount === 0;

  const countAlreadyShown = countElement.textContent === String(selectedCount);
  if (countAlreadyShown) return;

  countElement.textContent = selectedCount;
  countElement.classList.remove("count-changed");
  void countElement.offsetWidth;          /* restart the pulse animation */
  countElement.classList.add("count-changed");

  moveOnToTheNextWord();
}

function toggleCategory(categoryButton) {
  const isNowChecked = categoryButton.getAttribute("aria-checked") !== "true";
  categoryButton.setAttribute("aria-checked", String(isNowChecked));   /* the CSS draws and undraws the mark */
  refreshSelectedQuestionCount();
}

categoryButtons.forEach(categoryButton => {
  categoryButton.addEventListener("click", () => toggleCategory(categoryButton));
});

startButton.addEventListener("click", () => {
  const pool = questionsInCategories(selectedCategorySlugs());
  if (pool.length === 0) return;
  goToQuestion(pool[0].id, selectedCategorySlugs());
});

/* ------------------------------------------------ a question in an address */

/* Sharing sends the question itself rather than its number: its text, its notes
   and the name of its category are packed into the address as base64. Question
   numbers are positional, so a link built from one silently points somewhere
   else as soon as questions.md is reordered; a link that carries the question
   needs nothing at all from the list on the page that opens it. */

function encodeQuestionForSharing(question) {
  const packedQuestion = JSON.stringify([question.text, question.notes, question.categoryName]);

  /* btoa only speaks bytes, and Czech text is not latin-1. */
  const utf8Bytes = new TextEncoder().encode(packedQuestion);
  let oneCharacterPerByte = "";
  utf8Bytes.forEach(byte => { oneCharacterPerByte += String.fromCharCode(byte); });

  /* base64url: "+" and "/" would have to be escaped inside a hash, and the "="
     padding is pure noise in a link nobody gets to shorten. */
  return btoa(oneCharacterPerByte).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function decodeSharedQuestion(encodedQuestion) {
  try {
    const paddingLength = Math.ceil(encodedQuestion.length / 4) * 4;
    const standardBase64 = encodedQuestion.replace(/-/g, "+").replace(/_/g, "/").padEnd(paddingLength, "=");

    const oneCharacterPerByte = atob(standardBase64);
    const utf8Bytes = Uint8Array.from(oneCharacterPerByte, character => character.charCodeAt(0));
    const [text, notes, categoryName] = JSON.parse(new TextDecoder().decode(utf8Bytes));

    const addressHeldSomethingElse = typeof text !== "string" || !Array.isArray(notes);
    if (addressHeldSomethingElse) return null;

    /* Shaped like a question from the list, so the reader can show it without
       knowing where it came from — except that it belongs to no category here,
       and the flag is what keeps its address from being rewritten as a number. */
    return {
      id: "",
      text: text,
      notes: notes,
      category: "",
      categoryName: typeof categoryName === "string" ? categoryName : "",
      isASharedQuestion: true
    };
  } catch (theAddressWasNotAQuestion) {
    return null;
  }
}

/* ---------------------------------------------------------------- routing */

/* Browsing keeps a readable address — #q=12&c=detstvi,vztahy — while a shared
   question travels whole, as #s=<base64>. */
function addressOfQuestionInPool(questionId, categorySlugs) {
  return "#q=" + questionId + "&c=" + categorySlugs.join(",");
}

function addressOfSharedQuestion(question) {
  return "#s=" + encodeQuestionForSharing(question);
}

function writeLocation(address) {
  if (location.hash !== address) location.hash = address;
}

function readLocation() {
  const parameters = new URLSearchParams(location.hash.replace(/^#/, ""));

  if (parameters.has("s")) {
    const sharedQuestion = decodeSharedQuestion(parameters.get("s"));
    return sharedQuestion === null ? null : { sharedQuestion: sharedQuestion };
  }

  if (!parameters.has("q")) return null;

  const requestedCategories = (parameters.get("c") || "").split(",").filter(Boolean);
  return {
    questionId: parameters.get("q"),
    categorySlugs: requestedCategories.length > 0 ? requestedCategories : allCategorySlugs()
  };
}

function allCategorySlugs() {
  return categoryButtons.map(button => button.dataset.slug);
}

function goToQuestion(questionId, categorySlugs) {
  writeLocation(addressOfQuestionInPool(questionId, categorySlugs));
  renderCurrentLocation();
}

function returnToIntro() {
  location.hash = "";
  renderCurrentLocation();
}

/* The entrance plays once, on the first load. Returning from a question drops
   those classes — rather than switching animation off wholesale, which would
   also silence the pulse on the question count. */
const introEntranceElements = Array.from(introPage.querySelectorAll(".intro-fade-in"));

function replaceIntroEntranceWithAQuickFade() {
  titleElement.classList.remove("title-animated");
  introEntranceElements.forEach(element => element.classList.remove("intro-fade-in"));

  introPage.classList.remove("intro-returning");
  void introPage.offsetWidth;            /* restart the fade on every return */
  introPage.classList.add("intro-returning");
}

/* ------------------------------------------------------------ reader page */

let currentPool = [];
let currentPosition = 0;

function showQuestionAtPosition(position, travelDirection) {
  const question = currentPool[position];
  if (!question) return;

  currentPosition = position;
  writeLocation(question.isASharedQuestion
    ? addressOfSharedQuestion(question)
    : addressOfQuestionInPool(question.id, currentPool.map(item => item.category).filter(uniqueValues)));

  questionStage.innerHTML = "";
  const block = document.createElement("div");
  block.className = travelDirection === "backward" ? "enter-backward" : "enter-forward";
  block.style.display = "flex";
  block.style.flexDirection = "column";
  block.style.alignItems = "center";
  block.style.gap = "1.6rem";

  const categoryLabel = document.createElement("div");
  categoryLabel.className = "question-category";
  categoryLabel.textContent = question.categoryName;
  block.appendChild(categoryLabel);

  const questionText = document.createElement("h2");
  questionText.className = "question-text";
  questionText.textContent = question.text;
  block.appendChild(questionText);

  if (question.notes.length > 0) {
    const notes = document.createElement("div");
    notes.className = "question-notes";
    question.notes.forEach(noteText => {
      const paragraph = document.createElement("p");
      paragraph.textContent = noteText;
      notes.appendChild(paragraph);
    });
    block.appendChild(notes);
  }

  questionStage.appendChild(block);
  renderNavigationDots();
}

function uniqueValues(value, index, array) {
  return array.indexOf(value) === index;
}

function renderNavigationDots() {
  navigationDots.innerHTML = "";

  currentPool.forEach((question, position) => {
    const humanNumber = position + 1;
    const isMilestone = humanNumber % 5 === 0;

    const dot = document.createElement("button");
    dot.className = isMilestone ? "nav-dot is-milestone" : "nav-dot";
    dot.dataset.label = humanNumber;
    dot.setAttribute("aria-label", "Otázka " + humanNumber);
    dot.title = question.text;
    if (position === currentPosition) dot.setAttribute("aria-current", "true");

    dot.addEventListener("click", () => {
      showQuestionAtPosition(position, position < currentPosition ? "backward" : "forward");
    });

    navigationDots.appendChild(dot);
  });

  previousButton.disabled = currentPosition === 0;
  nextButton.disabled = currentPosition === currentPool.length - 1;
}

function stepBy(offset) {
  const target = currentPosition + offset;
  if (target < 0 || target >= currentPool.length) return;
  showQuestionAtPosition(target, offset < 0 ? "backward" : "forward");
}

previousButton.addEventListener("click", () => stepBy(-1));
nextButton.addEventListener("click", () => stepBy(+1));
backButton.addEventListener("click", returnToIntro);

/* ------------------------------------------------------------------ share */

/* Both screens can be shared, and what travels is whatever is on them: from the
   reader, the question itself packed into an #s= address; from the intro, there
   is no one question to carry, so it is simply the page — the bare link, with
   no hash for the reader to land in. */
function whatThisScreenShares() {
  const addressWithoutAHash = location.href.split("#")[0];
  const weAreLookingAtAQuestion = introPage.hidden;

  if (!weAreLookingAtAQuestion) {
    /* The site's own description, rather than a second copy of it here. */
    const siteDescription = document.querySelector('meta[name="description"]').content;
    return { text: siteDescription, link: addressWithoutAHash };
  }

  const question = currentPool[currentPosition];
  return { text: question.text, link: addressWithoutAHash + addressOfSharedQuestion(question) };
}

async function shareThisScreen() {
  const shared = whatThisScreenShares();

  if (navigator.share) {
    try {
      await navigator.share({ title: document.title, text: shared.text, url: shared.link });
      return;
    } catch (shareWasCancelled) {
      return;
    }
  }

  try {
    await navigator.clipboard.writeText(shared.link);
    showToast("Odkaz zkopírován");
  } catch (clipboardIsUnavailable) {
    showToast(shared.link);
  }
}

let toastTimer = null;
function showToast(message) {
  toast.textContent = message;
  toast.classList.add("is-visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2400);
}

/* One pair of actions per screen, all doing the same thing — hence a class
   rather than an id, and one listener each. */
document.querySelectorAll(".share-button").forEach(button => {
  button.addEventListener("click", shareThisScreen);
});

/* ------------------------------------------------- proposing a question */

/* The form is a third screen rather than an address of its own: a half-written
   question is nothing anyone would want to land on, share or reload into, so
   opening it leaves the hash — and the question underneath — exactly as it was.

   A static file cannot send mail on its own, so Send posts the finished message
   to a relay that sends it onwards — from the relay's own address, without
   anything opening on the proposer's device. The mailto below is what is left
   when that cannot be reached. */

/* Paste the access key mailed by <https://web3forms.com> here — until then every
   proposal falls back to the mail draft. The key is not a secret: it can only be
   used to send to the inbox it was issued for, and this file is published. */
const PROPOSAL_RELAY = "https://api.web3forms.com/submit";
const PROPOSAL_RELAY_ACCESS_KEY = "c5b4d20a-3514-4c5a-9839-cdd6a58385d1";

const PROPOSALS_ARE_SENT_TO = "mrazekmates@gmail.com";

const proposalPage       = document.getElementById("proposal-page");
const proposalForm       = document.getElementById("proposal-form");
const proposalBackButton = document.getElementById("proposal-back-button");
const categoryField      = document.getElementById("category-field");
const categoryChoices    = document.getElementById("category-choices");
const newCategoryButton  = document.getElementById("new-category-button");
const newCategoryInput   = document.getElementById("new-category-input");
const questionInput      = document.getElementById("question-input");
const noteInput          = document.getElementById("note-input");
const nameInput          = document.getElementById("name-input");
const emailInput         = document.getElementById("email-input");
const emailProblem       = document.getElementById("email-problem");
const sendButton         = document.getElementById("send-button");
const sendButtonLabel    = document.getElementById("send-button-label");
const sendProblem        = document.getElementById("send-problem");
const mailDraftLink      = document.getElementById("mail-draft-link");

/* The form can be reached from either screen, and since it is not a place in
   the address there is nothing to return to but the screen it covered up. */
let theScreenUnderTheProposalForm = introPage;

function openProposalForm() {
  theScreenUnderTheProposalForm = questionPage.hidden ? introPage : questionPage;
  proposalBackButton.setAttribute("aria-label", theScreenUnderTheProposalForm === introPage
    ? "Zpět na výběr kategorií"
    : "Zpět na otázku");

  theScreenUnderTheProposalForm.hidden = true;
  proposalPage.hidden = false;
  openEveryRowThatHasWordsInIt();
}

function closeProposalForm() {
  proposalPage.hidden = true;
  theScreenUnderTheProposalForm.hidden = false;

  /* Showing the intro again would otherwise replay its whole staggered arrival,
     which is a long wait for a screen you were just looking at. */
  if (theScreenUnderTheProposalForm === introPage) replaceIntroEntranceWithAQuickFade();
}

document.querySelectorAll(".propose-button").forEach(button => {
  button.addEventListener("click", openProposalForm);
});
proposalBackButton.addEventListener("click", closeProposalForm);

/* --- opening a row ------------------------------------------------------- */

/* A row opens on the first click anywhere along it and stays open: its comment
   has already had its say, and taking it back would only flicker. */
const writableFields = Array.from(proposalForm.querySelectorAll(".proposal-field"))
  .filter(field => field.querySelector(".proposal-slot"));

writableFields.forEach(field => {
  const writingLine = field.querySelector(".proposal-input");
  field.addEventListener("click", () => {
    field.classList.add("is-open");

    /* Clicking the words already written there is how you place the caret in
       them — taking the focus again would only drag it back to the end. */
    const theCaretIsAlreadyThere = document.activeElement === writingLine;
    if (!theCaretIsAlreadyThere) writingLine.focus();
  });
});

/* --- the category line --------------------------------------------------- */

/* The form offers the categories the site is built from, plus room for one it
   has never heard of. */
function offerTheSiteSOwnCategories() {
  categoryButtons.forEach(categoryButton => {
    const choice = document.createElement("button");
    choice.type = "button";
    choice.className = "proposal-choice";
    choice.setAttribute("aria-pressed", "false");
    choice.textContent = categoryButton.querySelector(".category-name").textContent;
    choice.addEventListener("click", () => chooseExistingCategory(choice));
    categoryChoices.insertBefore(choice, newCategoryButton);
  });
}

function everyCategoryControl() {
  return Array.from(categoryChoices.querySelectorAll(".proposal-choice"));
}

/* One category at a time: picking an existing one puts the new-category line
   away, and starting a new one lets go of whichever was picked. */
function markTheChosenCategory(chosenControl) {
  everyCategoryControl().forEach(control => {
    control.setAttribute("aria-pressed", String(control === chosenControl));
  });
  categoryField.classList.add("is-open");
}

function chooseExistingCategory(choice) {
  markTheChosenCategory(choice);
  newCategoryInput.value = "";
  newCategoryInput.hidden = true;
  theFormWasEdited();
}

function startANewCategory() {
  markTheChosenCategory(newCategoryButton);
  newCategoryInput.hidden = false;
  newCategoryInput.focus();
  theFormWasEdited();
}

function chosenCategoryName() {
  const aNewOneIsBeingWritten = newCategoryButton.getAttribute("aria-pressed") === "true";
  if (aNewOneIsBeingWritten) return newCategoryInput.value.trim();

  const pickedChoice = everyCategoryControl()
    .find(control => control !== newCategoryButton && control.getAttribute("aria-pressed") === "true");
  return pickedChoice ? pickedChoice.textContent : "";
}

newCategoryButton.addEventListener("click", startANewCategory);
offerTheSiteSOwnCategories();

/* --- writing ------------------------------------------------------------- */

/* The writing line has no box to scroll inside, so it grows to fit instead.
   Only the question and the note are written this way — a name, an address or a
   category is one line by construction, which is why the rest are <input>s. */
function growToFitTheText(textarea) {
  textarea.style.height = "auto";
  textarea.style.height = textarea.scrollHeight + "px";
}

[questionInput, noteInput].forEach(textarea => {
  textarea.addEventListener("input", () => growToFitTheText(textarea));
});

const EMAIL_SHAPE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function theEmailIsUsable() {
  const typedAddress = emailInput.value.trim();
  const itWasLeftOut = typedAddress === "";
  return itWasLeftOut || EMAIL_SHAPE.test(typedAddress);
}

/* Send lights up the way Start does on the intro: only once there is something
   worth sending. The note is the one part nobody has to write. */
function refreshSendButton() {
  const theProposalIsComplete =
    chosenCategoryName() !== "" &&
    questionInput.value.trim() !== "" &&
    nameInput.value.trim() !== "";

  sendButton.disabled = !(theProposalIsComplete && theEmailIsUsable());
}

/* Anything the writer changes is a fresh attempt: whatever the last one had to
   say about itself no longer applies. */
function theFormWasEdited() {
  sendProblem.hidden = true;
  openEveryRowThatHasWordsInIt();
  refreshSendButton();
}

/* Words can also arrive in a row nobody opened — a browser filling in a name or
   an address it remembers. A row with something in it is an open row, or the
   writing would sit there at nought opacity where no one can see it. */
function openEveryRowThatHasWordsInIt() {
  writableFields.forEach(field => {
    const writingLine = field.querySelector(".proposal-input");
    if (writingLine.value !== "") field.classList.add("is-open");
  });
}

[newCategoryInput, questionInput, noteInput, nameInput].forEach(field => {
  field.addEventListener("input", theFormWasEdited);
});

/* Complaining about a half-typed address while it is still being typed would be
   nagging, so the address is only judged once it has been left alone. */
emailInput.addEventListener("input", () => {
  emailProblem.hidden = true;
  theFormWasEdited();
});
emailInput.addEventListener("blur", () => {
  emailProblem.hidden = theEmailIsUsable();
});

/* --- sending ------------------------------------------------------------- */

function composeProposalEmail() {
  const categoryName = chosenCategoryName();

  const lines = ["Category: " + categoryName, "", "Question:", questionInput.value.trim()];

  const note = noteInput.value.trim();
  if (note !== "") lines.push("", "Note:", note);

  lines.push("", "Proposed by: " + nameInput.value.trim());

  const email = emailInput.value.trim();
  if (email !== "") lines.push("Reply to: " + email);

  return {
    subject: "Nová otázka od Ivči (" + categoryName + ")",
    body: lines.join("\n")
  };
}

/* The relay posts the message on from its own servers, which is the whole point
   of it: nothing opens on the proposer's device, and the only address of theirs
   that travels is the one they chose to type. Its access key belongs in public
   page source — it can do nothing but send to the one inbox it was issued for. */
async function relayTheProposal() {
  const thereIsNowhereToRelayThrough = PROPOSAL_RELAY_ACCESS_KEY === "";
  if (thereIsNowhereToRelayThrough) return false;

  const email = composeProposalEmail();
  const proposerEmail = emailInput.value.trim();

  const message = {
    access_key: PROPOSAL_RELAY_ACCESS_KEY,
    from_name: "Otázka od Ivči",
    subject: email.subject,
    message: email.body
  };

  /* Sent only when it was given: it becomes the Reply-To of what arrives, and
     the relay rejects the whole submission over an empty one. */
  if (proposerEmail !== "") message.email = proposerEmail;

  const response = await fetch(PROPOSAL_RELAY, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(message)
  });

  const outcome = await response.json().catch(() => ({}));
  return response.ok && outcome.success === true;
}

function mailtoDraftOfTheProposal() {
  const email = composeProposalEmail();
  return "mailto:" + PROPOSALS_ARE_SENT_TO
    + "?subject=" + encodeURIComponent(email.subject)
    + "&body=" + encodeURIComponent(email.body);
}

/* Back to an empty form, so a second question does not start inside the first. */
function forgetTheWrittenProposal() {
  [newCategoryInput, questionInput, noteInput, nameInput, emailInput].forEach(field => {
    field.value = "";
  });
  [questionInput, noteInput].forEach(growToFitTheText);

  everyCategoryControl().forEach(control => control.setAttribute("aria-pressed", "false"));
  newCategoryInput.hidden = true;
  emailProblem.hidden = true;
  sendProblem.hidden = true;

  Array.from(proposalForm.querySelectorAll(".proposal-field")).forEach(field => {
    field.classList.remove("is-open");
  });
  refreshSendButton();
}

let aProposalIsOnItsWay = false;

async function sendProposal() {
  if (sendButton.disabled || aProposalIsOnItsWay) return;

  aProposalIsOnItsWay = true;
  sendButton.disabled = true;
  sendProblem.hidden = true;
  sendButtonLabel.textContent = "Sending";

  try {
    const itWentThrough = await relayTheProposal();
    if (!itWentThrough) throw new Error("the relay would not take it");

    forgetTheWrittenProposal();
    closeProposalForm();
    showToast("Thank you — your question is on its way.");
  } catch (theRelayCouldNotBeReached) {
    /* Offline, or no key yet, or the relay having a bad day. Nothing is lost —
       the words are all still on the screen, and the device's own mail is one
       click away. It has to be a click of its own: a browser will not open mail
       on a gesture as old as the one that started this request. */
    mailDraftLink.href = mailtoDraftOfTheProposal();
    sendProblem.hidden = false;
    showToast("Couldn't send it from here.");
  } finally {
    aProposalIsOnItsWay = false;
    sendButtonLabel.textContent = "Send";
    refreshSendButton();
  }
}

proposalForm.addEventListener("submit", event => {
  event.preventDefault();
  sendProposal();
});

/* -------------------------------------------------------- keyboard & swipe */

document.addEventListener("keydown", event => {
  /* While the form is up the arrow keys belong to the words being written. */
  if (!proposalPage.hidden) {
    if (event.key === "Escape") closeProposalForm();
    return;
  }

  if (questionPage.hidden) return;
  if (event.key === "ArrowRight") stepBy(+1);
  if (event.key === "ArrowLeft")  stepBy(-1);
  if (event.key === "Escape")     returnToIntro();
});

let touchStartX = 0;
questionPage.addEventListener("touchstart", event => {
  touchStartX = event.changedTouches[0].clientX;
}, { passive: true });

questionPage.addEventListener("touchend", event => {
  const travelled = event.changedTouches[0].clientX - touchStartX;
  if (Math.abs(travelled) < 60) return;
  stepBy(travelled < 0 ? +1 : -1);
}, { passive: true });

/* ------------------------------------------------------------ page switch */

function renderCurrentLocation() {
  const destination = readLocation();
  proposalPage.hidden = true;      /* the address never points at the form */

  if (destination === null) {
    const arrivingFromAQuestion = !questionPage.hidden;
    questionPage.hidden = true;
    introPage.hidden = false;
    if (arrivingFromAQuestion) replaceIntroEntranceWithAQuickFade();
    refreshSelectedQuestionCount();
    return;
  }

  /* A shared question stands alone: it is the entire pool, which is why the bar
     below it holds a single dot. Nothing about it belongs to a category here, so
     the category buttons are left showing whatever the reader last chose. */
  if (destination.sharedQuestion) {
    currentPool = [destination.sharedQuestion];
    currentPosition = 0;
    introPage.hidden = true;
    questionPage.hidden = false;
    showQuestionAtPosition(0, "forward");
    return;
  }

  const pool = questionsInCategories(destination.categorySlugs);
  const positionOfRequestedQuestion = pool.findIndex(question => question.id === destination.questionId);

  /* A shared link may point at a question outside the remembered selection —
     in that case we simply widen the pool to everything. */
  if (positionOfRequestedQuestion === -1) {
    currentPool = ALL_QUESTIONS;
    currentPosition = ALL_QUESTIONS.findIndex(question => question.id === destination.questionId);
    if (currentPosition === -1) { returnToIntro(); return; }
  } else {
    currentPool = pool;
    currentPosition = positionOfRequestedQuestion;
  }

  syncCategoryButtonsTo(currentPool.map(question => question.category).filter(uniqueValues));

  introPage.hidden = true;
  questionPage.hidden = false;
  showQuestionAtPosition(currentPosition, "forward");
}

function syncCategoryButtonsTo(categorySlugs) {
  categoryButtons.forEach(button => {
    const shouldBeChecked = categorySlugs.includes(button.dataset.slug);
    button.setAttribute("aria-checked", String(shouldBeChecked));
    button.querySelector(".category-box").textContent = shouldBeChecked ? "[×]" : "[ ]";
  });
}

window.addEventListener("hashchange", renderCurrentLocation);

refreshSelectedQuestionCount();
renderCurrentLocation();
</script>

</body>
</html>
